<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">ZeroHub — an orbital map of university discovery</title>
  <desc id="desc">A conceptual university selection map. Cobalt and violet orbital paths connect a central ZeroHub mark to university, interests, and opportunity symbols. A third place ITFest award appears in the corner.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b3baff" stroke-opacity=".04"/></pattern></defs>
  <path fill="#10121b" d="M0 0h960v620H0z"/><path fill="url(#grid)" d="M0 0h960v620H0z"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="11" letter-spacing="2" fill="#a8adc2"><text x="48" y="49">ZEROHUB / SYSTEM STUDY</text><text x="912" y="49" text-anchor="end">02 — FIND YOUR ORBIT</text></g><path d="M48 70H912" stroke="#303445"/>
    <text x="49" y="131" fill="#f1f0eb" font-size="38" letter-spacing="-1.3">A direction worth exploring.</text>
    <text x="50" y="157" fill="#858da8" font-size="11" letter-spacing="1.8">UNIVERSITY DISCOVERY, CONNECTED</text>
    <g fill="none"><ellipse cx="476" cy="348" rx="303" ry="118" transform="rotate(-17 476 348)" stroke="#485bda" stroke-width="1.2"/><ellipse cx="476" cy="348" rx="250" ry="177" transform="rotate(21 476 348)" stroke="#655098" stroke-width="1.2"/><circle cx="476" cy="348" r="138" stroke="#41485f" stroke-dasharray="2 9"/><path d="M173 348h606M476 175v346" stroke="#283043" stroke-dasharray="3 7"/></g>
    <g fill="#10121b" stroke="#3b435d"><circle cx="476" cy="348" r="93"/><circle cx="476" cy="348" r="80"/></g>
    <path d="M449 266a86 86 0 0 1 109 66" fill="none" stroke="#7589ff" stroke-width="3"/>
    <text x="476" y="342" text-anchor="middle" fill="#e5e9ff" font-size="35" letter-spacing="5">ZERO</text><text x="478" y="375" text-anchor="middle" fill="#8b9cff" font-size="24" letter-spacing="10">HUB</text>
    <g fill="#191e31" stroke="#6577e5"><rect x="199" y="286" width="82" height="82" rx="41"/><rect x="657" y="357" width="82" height="82" rx="41"/></g>
