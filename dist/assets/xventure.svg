<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">xVenture — a conceptual scoring workflow</title>
  <desc id="desc">An editorial system study with four connected stages: input, AI context, scoring, and rank. Orange signal lines cross a charcoal technical grid.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#ff6138"/></marker>
  </defs>
  <path fill="#111110" d="M0 0h960v620H0z"/><path fill="url(#grid)" d="M0 0h960v620H0z"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="11" letter-spacing="2" fill="#aaa9a1"><text x="48" y="49">XVENTURE / SYSTEM STUDY</text><text x="912" y="49" text-anchor="end">01 — DECISION FLOW</text></g>
    <path d="M48 70H912" stroke="#343430"/>
    <text x="48" y="139" font-size="46" letter-spacing="-2" fill="#f0eee6">From signal to conviction.</text>
    <text x="50" y="167" font-size="12" letter-spacing="1.2" fill="#8e8e85">A CONCEPTUAL VIEW OF THE EVALUATION PIPELINE</text>
    <g stroke="#ff6138" fill="none" stroke-width="1.5" marker-end="url(#arrow)"><path d="M246 309h44"/><path d="M440 309h44"/><path d="M634 309h44"/></g>
    <path d="M168 255v-37h582v37" stroke="#514138" stroke-dasharray="3 7" fill="none"/>
    <text x="458" y="211" text-anchor="middle" font-size="9" letter-spacing="1.8" fill="#a18e82">CONTEXT TRAVELS WITH THE SIGNAL</text>
    <g fill="#191917" stroke="#43423b"><rect x="88" y="255" width="158" height="150" rx="3"/><rect x="282" y="255" width="158" height="150" rx="3"/><rect x="476" y="255" width="158" height="150" rx="3"/></g>
    <rect x="670" y="255" width="158" height="150" rx="3" fill="#ff6138"/>
    <g fill="#ff6138" font-size="10" letter-spacing="1.3"><text x="106" y="280">01 / INGEST</text><text x="300" y="280">02 / ENRICH</text><text x="494" y="280">03 / EVALUATE</text></g>
    <text x="688" y="280" fill="#41190f" font-size="10" letter-spacing="1.3">04 / PRIORITIZE</text>
    <g stroke="#dad7ca" fill="none" stroke-width="1.3"><path d="M108 305h24v26h-24zM113 312h14m-14 6h10m-10 6h12"/><path d="m322 304 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/><path d="M496 331v-11m9 11v-23m9 23v-17m9 17v-28"/></g>
    <g stroke="#41190f" stroke-width="1.5" fill="none"><path d="M691 333h29M695 333v-14h7v14m4 0v-27h7v27m4 0v-20h7v20"/></g>
    <g font-size="18" fill="#ece9dc" letter-spacing=".3"><text x="106" y="365">INPUT</text><text x="300" y="365">AI CONTEXT</text><text x="494" y="365">SCORING</text></g>
    <text x="688" y="365" fill="#29140e" font-size="18" letter-spacing=".3">RANK</text>
    <g font-size="9" fill="#8d8b81" letter-spacing="1.1"><text x="106" y="386">STRUCTURED SIGNALS</text><text x="300" y="386">RICHER PERSPECTIVE</text><text x="494" y="386">WEIGHTED CRITERIA</text></g>
    <text x="688" y="386" font-size="9" fill="#572718" letter-spacing="1.1">ORDERED OPPORTUNITY</text>
    <g fill="none" stroke="#555247"><path d="M168 420v33h582v-33"/><circle cx="168" cy="453" r="3" fill="#111110"/><circle cx="750" cy="453" r="3" fill="#111110"/></g>
    <text x="459" y="477" text-anchor="middle" font-size="10" fill="#8c8b81" letter-spacing="2">TRACEABLE AT EVERY STEP</text>
    <path d="M48 548H912" stroke="#343430"/>
    <circle cx="53" cy="577" r="4" fill="#ff6138"/><text x="69" y="581" font-size="10" letter-spacing="1.5" fill="#aaa99e">IDEA → CONTEXT → DECISION</text><text x="912" y="581" text-anchor="end" font-size="10" letter-spacing="1.5" fill="#6e6e65">CONCEPTUAL DIAGRAM</text>
  </g>
</svg>
